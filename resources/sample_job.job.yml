# A sample job for test_python.

resources:

  schemas:
    dev:
      name: "test"
      catalog_name: "${var.catalog}"

  jobs:
    sample_job:
      name: sample_job

      tasks:
        - task_key: python_wheel_task
          python_wheel_task:
            package_name: test_python
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.dev.name}"
          environment_key: default

        - task_key: refresh_pipeline
          depends_on:
            - task_key: python_wheel_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.test_python_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
