# This is a Declarative Automation Bundle definition for test_python.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test_python
  uuid: 0804429d-83d9-4420-a9f8-f202038a61ad

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
   


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f67052a4-d0c8.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-f67052a4-d0c8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/christophbieritz1989@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/christophbieritz1989@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: christophbieritz1989@gmail.com
        level: CAN_MANAGE
